plugins {
    id 'com.android.application'
}

android {
    namespace 'app.liquidglass.os'
    compileSdk 34

    defaultConfig {
        applicationId 'app.liquidglass.os'
        // minSdk 21 keeps it installable on very old XOS / Android builds.
        // Newer effects (real window blur) switch on automatically at Android 12+.
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

// No third-party dependencies on purpose: plain Android framework views only.
